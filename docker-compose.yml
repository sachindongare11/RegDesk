services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI / HTTP API, used by scripts/ingest_corpus.py
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/11434'"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp-tools:
    build: ./services/mcp-tools
    environment:
      MCP_TOOLS_QDRANT_URL: http://qdrant:6333
      MCP_TOOLS_OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

  agent-api:
    build: ./services/agent-api
    environment:
      AGENT_API_MCP_TOOLS_URL: http://mcp-tools:8000/mcp
      AGENT_API_OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    depends_on:
      - mcp-tools

  ingest-worker:
    build: ./services/ingest-worker
    environment:
      INGEST_WORKER_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INGEST_WORKER_QDRANT_URL: http://qdrant:6333
      INGEST_WORKER_OLLAMA_BASE_URL: http://ollama:11434
      INGEST_WORKER_CORPUS_DIR: /data/regulations
    volumes:
      - ./data/regulations:/data/regulations:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  qdrant-data:
  ollama-data:

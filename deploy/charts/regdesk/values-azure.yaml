# Overrides for deploying this chart to infra/envs/dev's AKS cluster
# instead of kind. Static parts only -- everything that's only known
# after `terraform apply` (the ACR login server, the Key Vault name, the
# ingest-worker workload identity's client ID) gets passed with --set at
# deploy time instead of hardcoded here. See scripts/deploy_azure.sh,
# which does both: `helm upgrade --install -f values-azure.yaml --set ...`.
#
# Everything not mentioned here (resource requests/limits, HPA/KEDA
# thresholds, NetworkPolicies, security contexts) is unchanged from
# values.yaml -- this cluster is sized the same as kind on purpose, same
# dev-cost reasoning.

mcpTools:
  image:
    tag: latest
    # A real registry, not kind's local-only trick -- IfNotPresent still
    # avoids a pull on every pod restart once the image's been fetched
    # once per node.
    pullPolicy: IfNotPresent

agentApi:
  image:
    tag: latest
    pullPolicy: IfNotPresent

ingestWorker:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  azureKeyVault:
    enabled: true

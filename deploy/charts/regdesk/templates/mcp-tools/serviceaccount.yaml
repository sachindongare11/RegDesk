apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-tools
  labels:
    {{- include "regdesk.labels" . | nindent 4 }}
    {{- include "regdesk.selectorLabels" "mcp-tools" | nindent 4 }}
# No automountServiceAccountToken: mcp-tools never talks to the Kubernetes
# API, so there's no reason to hand its pod a token that could talk to it.
automountServiceAccountToken: false

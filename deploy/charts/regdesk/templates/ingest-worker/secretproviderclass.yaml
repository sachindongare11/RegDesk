{{- if .Values.ingestWorker.azureKeyVault.enabled }}
# Syncs two Key Vault secrets into a native Kubernetes Secret
# (ingest-worker-keyvault-secrets, via secretObjects below) so
# deployment.yaml's env vars can keep using an ordinary secretKeyRef --
# no application code change needed, only where the Secret's data comes
# from. The CSI driver only performs that sync when something actually
# mounts this SecretProviderClass as a volume (see deployment.yaml's
# azure-keyvault volume/volumeMount), even though nothing reads the
# mounted files directly.
#
# Authenticates via workload identity (the ingest-worker ServiceAccount's
# azure.workload.identity/client-id annotation, see serviceaccount.yaml),
# not a stored credential -- usePodIdentity/useVMManagedIdentity both
# false is what selects that mode.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ingest-worker-keyvault
  labels:
    {{- include "regdesk.labels" . | nindent 4 }}
    {{- include "regdesk.selectorLabels" "ingest-worker" | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.ingestWorker.azureKeyVault.clientId | quote }}
    keyvaultName: {{ .Values.ingestWorker.azureKeyVault.vaultName | quote }}
    tenantId: {{ .Values.ingestWorker.azureKeyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.ingestWorker.azureKeyVault.usernameSecretName }}
          objectType: secret
        - |
          objectName: {{ .Values.ingestWorker.azureKeyVault.passwordSecretName }}
          objectType: secret
  secretObjects:
    - secretName: ingest-worker-keyvault-secrets
      type: Opaque
      data:
        - objectName: {{ .Values.ingestWorker.azureKeyVault.usernameSecretName }}
          key: username
        - objectName: {{ .Values.ingestWorker.azureKeyVault.passwordSecretName }}
          key: password
{{- end }}

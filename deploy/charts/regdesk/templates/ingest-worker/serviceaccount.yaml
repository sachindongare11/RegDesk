apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-worker
  labels:
    {{- include "regdesk.labels" . | nindent 4 }}
    {{- include "regdesk.selectorLabels" "ingest-worker" | nindent 4 }}
  {{- if .Values.ingestWorker.azureKeyVault.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.ingestWorker.azureKeyVault.clientId | quote }}
  {{- end }}
# No automountServiceAccountToken: ingest-worker talks to RabbitMQ, Qdrant,
# and Ollama, never the Kubernetes API, so it doesn't need a token. This
# is unrelated to (and doesn't block) Azure Workload Identity's own
# federated token above -- that's a separate, specifically-audienced
# projected volume the azure-wi-webhook injects on its own, not the
# default Kubernetes API token this setting controls.
automountServiceAccountToken: false

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-worker
  labels:
    {{- include "regdesk.labels" . | nindent 4 }}
    {{- include "regdesk.selectorLabels" "ingest-worker" | nindent 4 }}
# No automountServiceAccountToken: ingest-worker talks to RabbitMQ, Qdrant,
# and Ollama, never the Kubernetes API, so it doesn't need a token.
automountServiceAccountToken: false

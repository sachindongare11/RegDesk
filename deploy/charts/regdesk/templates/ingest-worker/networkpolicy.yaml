apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-worker
  labels:
    {{- include "regdesk.labels" . | nindent 4 }}
    {{- include "regdesk.selectorLabels" "ingest-worker" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "regdesk.selectorLabels" "ingest-worker" | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No `ingress:` block at all -- ingest-worker is a RabbitMQ consumer, not
  # a server; nothing should ever need to reach it, so leave it full-deny.
  egress:
    # RabbitMQ, Qdrant, and Ollama (see deploy/platform/) are deployed
    # in-namespace but owned by different charts, so these match any
    # same-namespace pod rather than labels this chart doesn't control.
    - to:
        - podSelector: {}
      ports:
        - port: {{ .Values.ingestWorker.rabbitmq.port }}
        - port: 6333
        - port: 11434

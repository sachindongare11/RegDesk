# Ollama (local LLM + embedding model runtime) for the kind cluster. Same
# image as Phase 1's docker-compose (ollama/ollama:latest) for consistency.
#
# emptyDir for /root/.ollama: see qdrant.yaml's note on why this is
# throwaway dev state rather than a PVC. The trade-off is sharper here --
# model weights are multiple GB and get re-pulled on every pod restart --
# but a kind cluster's node-local emptyDir survives pod restarts (only node
# deletion wipes it), and KEDA-triggered restarts of *this* Deployment
# don't happen (it isn't the ScaledObject's target, ingest-worker is), so
# in practice this only re-pulls after `kind delete cluster` or a manual
# pod delete.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: regdesk
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: regdesk-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: regdesk-platform
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            # No CPU limit, deliberately. Ollama sizes its inference thread
            # pool off the host's full logical CPU count, not any cgroup
            # quota -- so a `limits.cpu` here doesn't just cap throughput
            # proportionally, it causes CFS-quota throttling against a
            # thread count that was never adjusted for the smaller quota.
            # Measured effect: 2 cores -> ~18s/token; 6 cores -> prefill
            # alone (just the input prompt, before any output) still blew
            # past a 60s budget. docker-compose's Phase 1 stack sets no CPU
            # limit at all for this same image, which is why it doesn't hit
            # this. This is a single-node dev cluster with every other pod
            # using single-digit millicores, so there's no contention this
            # limit is actually protecting against -- only requests is kept,
            # for scheduling.
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 6Gi }
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: regdesk
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: regdesk-platform
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http

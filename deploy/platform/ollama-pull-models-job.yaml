# One-shot pull of both models this project needs (agent-api's generation
# model and the embedding model mcp-tools/ingest-worker share). Runs the
# same image as ollama.yaml's Deployment but only as a thin CLI client --
# `ollama pull` with OLLAMA_HOST set talks over HTTP to that Deployment and
# makes *it* download the weights into its own emptyDir, rather than
# pulling locally into this Job's own (ephemeral, throwaway-on-exit)
# filesystem.
#
# Kept in its own file (not alongside the Deployment/Service in ollama.yaml)
# because scripts/platform_up.sh deletes and re-applies just this Job on
# every run -- Jobs are immutable once created, so a plain `kubectl apply`
# on an unchanged spec is a no-op, but re-running the model pull on demand
# (e.g. after `kind delete cluster` wipes the emptyDir) needs delete-then-
# apply, and that shouldn't touch the long-lived Deployment/Service.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
  namespace: regdesk
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: regdesk-platform
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull-models
        app.kubernetes.io/part-of: regdesk-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: "ollama:11434"
          command:
            - sh
            - -c
            - |
              set -eu
              ollama pull qwen2.5:3b
              ollama pull nomic-embed-text
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
